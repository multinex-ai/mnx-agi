    <text x="64" y="198" fill="#e8eef2" font-size="28">Recursive Agent Harness + Persistent Memory</text>
    <rect x="64" y="232" width="1312" height="2" fill="url(#accent)" opacity="0.7"/>
    <text x="64" y="293" fill="#e8eef2" font-size="31" font-weight="650">Across agents. Across sessions. Compounding knowledge.</text>
    <text x="64" y="338" fill="#9fb0bf" font-size="22">Bring your models. Connect your tools. Build on what your agents learn.</text>
