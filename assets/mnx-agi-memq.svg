<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title description">
  <title id="title">MNX-AGI Recursive Agent Harness + MemQ</title>
  <desc id="description">Across agents. Across sessions. Compounding knowledge. A bounded loop connects recall, action, verification and learning to persistent memory.</desc>
