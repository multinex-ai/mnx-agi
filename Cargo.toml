[workspace]
resolver = "2"
members = [
  "crates/mnx-contracts",
  "crates/mnx-broker",
  "crates/mnx-harness",
]

[workspace.package]
version = "1.4.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Christopher Rijos <chris@multinex.ai>"]

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
opt-level = 3
debug = 0
strip = true
lto = "thin"
codegen-units = 1
